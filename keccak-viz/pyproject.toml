[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "keccakviz"
version = "0.1.0"
description = "Interactive 3D educational visualizer for the Keccak permutation and the SHA-3 / SHAKE sponge"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.21",
    "PyQt5>=5.15",
    "moderngl>=5.8",
]

[project.optional-dependencies]
test = ["pytest>=6"]

[project.scripts]
keccakviz = "keccakviz.ui.app:main"

[tool.setuptools.packages.find]
include = ["keccakviz*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
