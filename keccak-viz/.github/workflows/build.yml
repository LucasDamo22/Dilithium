name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.10"}
      - run: pip install -e ".[test]"
      - run: pytest -q          # NIST CAVP vectors, hashlib cross-checks, UI maths (no display needed)

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 = glibc 2.35: the binary runs on that and anything newer
          - os: ubuntu-22.04
            name: linux
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.10"}
      - run: pip install -e . pyinstaller
      - run: python build.py --onefile --clean
      - name: smoke test (Linux, software OpenGL)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1 libegl1 libxkbcommon-x11-0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-shape0
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a ./dist/keccakviz -m abc --snap 5 --screenshot smoke.png
          test -s smoke.png
      - name: smoke test (Windows)
        if: matrix.name == 'windows'
        run: |
          .\dist\keccakviz.exe -m abc --snap 5 --screenshot smoke.png
          if (!(Test-Path smoke.png)) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: keccakviz-${{ matrix.name }}
          path: |
            dist/keccakviz
            dist/keccakviz.exe
          if-no-files-found: error
      - name: attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/keccakviz
            dist/keccakviz.exe
